name: Recipe database

on:
  pull_request:
  push:
    branches: [main, newt-database]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install embedded PostgreSQL test engine
        run: npm install --prefix tmp/database-check --no-save --package-lock=false @electric-sql/pglite@0.5.16
      - name: Verify migrations and access rules
        run: node supabase/tests/database.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check backend functions
        run: deno check supabase/functions/delete-account/index.ts supabase/functions/cleanup-recipe-photos/index.ts
      - name: Check backend formatting
        run: deno fmt --check supabase/functions supabase/tests/database.test.mjs
